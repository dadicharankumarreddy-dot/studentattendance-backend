# Test configuration using in-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:attendance_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT settings
app.jwt.secret=test_jwt_secret_key_needs_to_be_at_least_256_bits_long_for_hmac_sha256_security_testing!
app.jwt.expiration-ms=3600000
