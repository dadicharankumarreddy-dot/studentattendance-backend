# =============================================================
# Student Attendance Management System - Backend Configuration
# =============================================================

# Server Port — Render sets PORT automatically
server.port=${PORT:8080}

# =============================================================
# DATABASE CONFIGURATION
# =============================================================
# On Render (PostgreSQL): Set DB_URL, DB_USERNAME, DB_PASSWORD,
#   and DB_DRIVER environment variables in the Render dashboard.
# Locally (no setup): Falls back to embedded H2 file database.
# Locally (MySQL):    Set DB_URL, DB_USERNAME, DB_PASSWORD,
#   and DB_DRIVER to your MySQL values in a .env file or IDE run config.
#
# PostgreSQL example values for Render:
#   DB_URL      = jdbc:postgresql://<host>/<dbname>
#   DB_USERNAME = <pg_user>
#   DB_PASSWORD = <pg_password>
#   DB_DRIVER   = org.postgresql.Driver
# =============================================================

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/attendance_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# PostgreSQL dialect is auto-detected from the driver; no manual dialect needed.
# If you ever need to force it:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================
# JWT Security Settings
# =============================================================
# IMPORTANT: Change JWT_SECRET to a strong secret before deploying!
app.jwt.secret=${JWT_SECRET:student_attendance_management_system_default_secret_key_minimum_256_bits_length_123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================
# Logging
# =============================================================
logging.level.com.attendance.backend=INFO
